name: CI

on:
  push:
    branches:
      - master
      - "feature/**"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show project files
        run: ls -la

      - name: Show Node version
        run: node --version

      - name: Install dependencies
        run: npm ci 

      - name: Run test
        run: npm test

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/compose-node-app:${{ github.sha }} .

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/compose-node-app:${{ github.sha }}